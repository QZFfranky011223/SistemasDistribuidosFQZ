services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bd_farmacia
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./serviceAuth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      DB_AUTH: bd_auth
      JWT_SECRET: farmacia_secret_2024
      JWT_EXPIRES: 24h
    depends_on:
      mongodb:
        condition: service_healthy

  ventas:
    build:
      context: ./serviceVentas
      dockerfile: Dockerfile
    container_name: ventas
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      DB_VENTAS: bd_ventas
      JWT_SECRET: farmacia_secret_2024
    depends_on:
      mongodb:
        condition: service_healthy

  laravel:
    build:
      context: ./farmacia
      dockerfile: Dockerfile
    container_name: laravel
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Farmacia
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bd_farmacia
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - ventas
      - laravel

volumes:
  mysql_data:
  mongo_data:
